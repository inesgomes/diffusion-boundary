project: 20260722_text_image_diffusion

user-args: 
  device: cuda:1
  seed: 28
  batch-size: 1
  save-metrics-disk: True
  save-images-disk: True
  log-plots: False

dataset:
  name: ILSVRC/imagenet-1k
  n_classes: 1000
  split: train
  num-images: 2500

classifier:
  name: google/vit-base-patch16-224 # microsoft/resnet-50
  lib: transformers
  calibrate: True

diffusion:
  pipeline: latentguidance
  name: CompVis/stable-diffusion-v1-4
  type: sd
  scheduler: klms # ddim
  args:
    num-inference-steps: 40
    prompt-strategy: single # and 
    classes:
      - golden retriever
      - Labrador retriever
    guidance: kldb # kldb, entropy, logit-margin
    # alpha
    alpha: 0
    # gamma
    guidance-freq: 5
    # beta
    guidance-scale: 7.5
    guidance-rescale: 0.7
    negative-prompt: blurry, deformed, low quality, watermark, text, extra limbs, ugly # if not specified, it is empty 

evaluation:
  num-images: 2500
  viz-sample-size: 10
  attr-map: False
