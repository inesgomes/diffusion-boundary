# Single rerun: dogs, ResNet-50 classifier, alpha=0.05. Same settings as 2-dogs-RN.yml
# otherwise. Single-element alpha list => exactly one run.
project: 20260722_text_image_diffusion-gpu

user-args:
  device: cuda:0
  seed: 28
  batch-size: 8
  save-metrics-disk: True
  save-images-disk: False
  log-plots: False

dataset:
  name: ILSVRC/imagenet-1k
  n_classes: 1000
  split: train
  num-images: 2500

classifier:
  name: microsoft/resnet-50
  lib: transformers
  calibrate: True

diffusion:
  pipeline: latentguidance
  name: CompVis/stable-diffusion-v1-4
  type: sd
  scheduler: klms
  args:
    num-inference-steps: 40
    prompt-strategy: single
    classes:
      - golden retriever
      - Labrador retriever
    guidance: kldb
    # alpha
    alpha:
      - 0.05
    # gamma
    guidance-freq: 5
    # beta
    guidance-scale: 7.5
    guidance-rescale: 0.7
    negative-prompt: blurry, deformed, low quality, watermark, text, extra limbs, ugly # if not specified, it is empty

evaluation:
  num-images: 2500
  viz-sample-size: 10
  attr-map: False
